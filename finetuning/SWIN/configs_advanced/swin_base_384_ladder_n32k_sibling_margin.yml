# Ladder: sibling margin on a cosine head (registry head "sibling", s=30) at the 32k rung.
# Made from swin_base_384_ladder_n32k_cosine_m0.yml (the NormFace run this is compared with):
# only the head and the output/run names differ. Data, seed, schedule, 131,250-step budget,
# batch size and evaluation settings are identical.
#
# Output folder and run names end in _R3: earlier launches (_R1 cancelled after 19 minutes, _R2 after 20 minutes,
# neither reached a checkpoint) left files behind, and the trainer refuses a non-empty folder it cannot resume from.
#
# Margin (rule in loss_ablation/sibling_margin.py): against a competing species j, the true
# species y must win by m(y, j) = m_max * (n_min / n_y)^tau for j in y's genus and 0 for every
# other species (family_weight 0: genus siblings only). m_max = 0.15 cosine units (about 10
# degrees at a 60-degree angle) for the rarest species; tau = 1 is DBM's rarity profile.
# The same-family term (family_weight > 0) is left off in this first run: at 32k it would reach
# about 700 other-genus species per image against about 50 genus siblings, and nothing in the
# project's results supports it; it is an ablation, not part of the idea under test.

model:
  model_name_or_path: "microsoft/swin-base-patch4-window12-384-in22k"
  config_name: null
  cache_dir: null
  model_revision: "main"
  image_processor_name: null
  token: null
  trust_remote_code: false
  ignore_mismatched_sizes: true

data:
  dataset_name: null
  dataset_config_name: null
  data_file: null
  data_dir: null
  train_file: "/projectnb/herbdl/workspaces/faridkar/herbdl/data/ladder/n32k_train.json"
  validation_file: "/projectnb/herbdl/workspaces/faridkar/herbdl/data/ladder/n32k_val.json"
  image_column_name: "filepath"
  label_column_name: "scientificNameEncoded"
  max_seq_length: 15
  max_train_samples: null
  max_eval_samples: null
  overwrite_cache: false
  preprocessing_num_workers: null
  train_val_split: 0.2

training:
  output_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_LADDER_N32K_SIBLING_R3"
  logging_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_LADDER_N32K_SIBLING_R3"
  do_train: true
  do_eval: true    # final evaluation only (eval_strategy "no" below): runs after the model is saved, so a hang cannot lose the model
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 64
  learning_rate: 0.0001
  num_train_epochs: 50   # ignored: max_steps below fixes the budget
  max_steps: 131250   # = the 15k runs' 50 epochs x 2,625 steps: same compute at every rung
  warmup_steps: 500
  weight_decay: 0.01
  optim: "adamw_torch_fused"
  gradient_accumulation_steps: 2   # 64 * 2 * 2 GPUs = effective batch 256
  lr_scheduler_type: "cosine"
  logging_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 3
  eval_strategy: "no"
  eval_steps: 26250
  report_to: "wandb"
  bf16: true
  dataloader_num_workers: 8
  remove_unused_columns: false
  overwrite_output_dir: false
  resume_from_checkpoint: newest
  seed: 42

custom:
  lr_type: "cosine"
  frozen: false
  frozen_type: "none"
  run_group: "SWIN_Base_LADDER_N32K_SIBLING_R3"
  run_name: "SWIN_Base_LADDER_N32K_SIBLING_R3"
  run_id: "swin_base_ladder_n32k_sibling_r3"
  run_notes: >
    Sibling margin on a cosine head (s=30, m_max=0.15, tau=1, genus siblings only) at the 32k
    rung. Same trainer, data, seed and 131,250-step budget as the 32k NormFace (cosine m=0),
    DBM, KappaFace and ArcFace ladder runs; only the head differs.

augmentation:
  use_advanced: false

multi_task:
  enabled: false

arcface:
  enabled: false

hace:
  enabled: false

loss_registry:
  enabled: true
  head: sibling
  head_kwargs:
    s: 30.0
    m_max: 0.15           # cosine units, for the species with the fewest training images
    tau: 1.0              # margin ~ (n_min / n_y)^tau
    family_weight: 0.0    # 0: genus siblings only; > 0 gives other genera of the same family this fraction
    genus_weight: 1.0
    log_every: 1000       # one __SIBLING__ line per 1000 forward calls on rank 0
  aux: []

long_tail:
  logit_adjustment: false

ema:
  enabled: false

multi_crop:
  enabled: false
  crop_sizes: [224]
  target_size: 224

wandb:
  enabled: true
  entity: "gardoslab"
  project: "herbdl"
  resume: "allow"
