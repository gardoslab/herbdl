# =============================================================================
# ArcFace + ECC (Exploration of Class Center) at 384px — real-scale pilot
# =============================================================================
# Same template as the other 384px pilots; enables loss_registry.head=arcface
# with aux=[ecc]. s=30.0/m=0.30 match loss_ablation/e2e_harness.py's
# already-validated smoke-test config; ECCAux uses its own defaults
# (lambda1=1.0, lambda2=1.0), same as the harness.
#
# IMPORTANT: this uses loss_ablation's OWN ArcMarginHead (via SwinWithLoss),
# NOT the production script's native SwinWithArcFace/SubCenterArcMarginProduct
# that every other ArcFace run in this project (plain 384px ablation,
# sub-center pilot) has used -- ECC's aux_modules only exist on SwinWithLoss.
# The two ArcFace implementations compute the same formula but are separate
# code, so this is also the first real-scale test of loss_ablation's own
# ArcMarginHead, not just of ECC. Not directly comparable to the native-path
# ArcFace numbers as a controlled ablation of ECC alone for that reason --
# note this when reading results.
#
# Same 12h-per-job-slot / multi-resume expectation as the earlier pilots.
# =============================================================================

model:
  model_name_or_path: "microsoft/swin-base-patch4-window12-384-in22k"
  config_name: null
  cache_dir: null
  model_revision: "main"
  image_processor_name: null
  token: null
  trust_remote_code: false
  ignore_mismatched_sizes: true

data:
  dataset_name: null
  dataset_config_name: null
  data_file: null
  data_dir: null
  train_file: "/projectnb/herbdl/data/kaggle-herbaria/train_2022.json"
  validation_file: "/projectnb/herbdl/data/kaggle-herbaria/val_2022.json"
  image_column_name: "filename"
  label_column_name: "scientificNameEncoded"
  max_seq_length: 15
  max_train_samples: null
  max_eval_samples: null
  overwrite_cache: false
  preprocessing_num_workers: null
  train_val_split: 0.2

training:
  output_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_ARCFACE_ECC_384_PILOT"
  logging_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_ARCFACE_ECC_384_PILOT"
  do_train: true
  do_eval: true
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 64
  learning_rate: 0.0001
  num_train_epochs: 50
  warmup_steps: 500
  weight_decay: 0.01
  optim: "adamw_torch_fused"
  gradient_accumulation_steps: 2   # 64 * 2 * 2 GPUs = effective batch 256
  lr_scheduler_type: "cosine"
  logging_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 55
  eval_strategy: "steps"
  eval_steps: 8964
  report_to: "wandb"
  bf16: true
  dataloader_num_workers: 16
  remove_unused_columns: false
  overwrite_output_dir: false
  seed: 42

custom:
  lr_type: "cosine"
  frozen: false
  frozen_type: "none"
  run_group: "SWIN_Base_ArcFaceECC_384_Pilot"
  run_name: "SWIN_Base_ArcFaceECC_384_Pilot"
  run_id: "swin_base_arcface_ecc_384_pilot"
  run_notes: >
    Real-scale pilot (50 epochs, 2 GPUs) of ArcFace+ECC via loss_ablation's
    own ArcMarginHead + ECCAux (not the production script's native
    SwinWithArcFace), matched against the other 384px pilots on every shared
    hyperparameter.

augmentation:
  use_advanced: false

multi_task:
  enabled: false

arcface:
  enabled: false

hace:
  enabled: false

loss_registry:
  enabled: true
  head: arcface
  head_kwargs:
    s: 30.0
    m: 0.30
  aux: [ecc]

long_tail:
  logit_adjustment: false

ema:
  enabled: false

multi_crop:
  enabled: false
  crop_sizes: [224]
  target_size: 224

wandb:
  enabled: true
  entity: "gardoslab"
  project: "herbdl"
  resume: "allow"
