# Training-image feature pass of n15k_ce (ladder_geom_train/generate.py from ladder_eval/n15k_ce.yml).
# Eval-only re-score of the ce model trained on the n15k rung (made by
# ladder_eval/generate.py from swin_base_384_ladder_n15k_ce.yml).
# Phase 6 scaling ladder: plain CE at the n15k rung (131,250 steps, 2 GPUs).
# Generated by gen_ladder_ce.py from swin_base_384_ladder_n15k_arcface.yml; only the head changes.

model:
  model_name_or_path: "microsoft/swin-base-patch4-window12-384-in22k"
  config_name: null
  cache_dir: null
  model_revision: "main"
  image_processor_name: null
  token: null
  trust_remote_code: false
  ignore_mismatched_sizes: true

data:
  dataset_name: null
  dataset_config_name: null
  data_file: null
  data_dir: null
  train_file: "/projectnb/herbdl/workspaces/faridkar/herbdl/data/ladder/n15k_train.json"
  validation_file: "/projectnb/herbdl/workspaces/faridkar/herbdl/data/ladder/n15k_train.json"
  image_column_name: "filepath"
  label_column_name: "scientificNameEncoded"
  max_seq_length: 15
  max_train_samples: null
  max_eval_samples: null
  overwrite_cache: false
  preprocessing_num_workers: null
  train_val_split: 0.2

training:
  output_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/LADDER_GEOM_TRAIN/n15k_ce"
  logging_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/LADDER_GEOM_TRAIN/n15k_ce"
  do_train: false
  do_eval: true
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 128
  learning_rate: 0.0001
  num_train_epochs: 50   # ignored: max_steps below fixes the budget
  max_steps: 131250   # = the 15k runs' 50 epochs x 2,625 steps: same compute at every rung
  warmup_steps: 500
  weight_decay: 0.01
  optim: "adamw_torch_fused"
  gradient_accumulation_steps: 2   # 64 * 2 * 2 GPUs = effective batch 256
  lr_scheduler_type: "cosine"
  logging_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 3
  eval_strategy: "steps"
  eval_steps: 26250
  report_to: "none"
  bf16: true
  dataloader_num_workers: 16
  remove_unused_columns: false
  overwrite_output_dir: false
  seed: 42

custom:
  lr_type: "cosine"
  frozen: false
  frozen_type: "none"
  run_group: "SWIN_Base_LADDER_N15K_CE"
  run_name: "SWIN_Base_LADDER_N15K_CE"
  run_id: "swin_base_ladder_n15k_ce"
  run_notes: >
    Plain cross-entropy through the loss registry's softmax head at this
    ladder rung: no margin and no label smoothing, same data, steps and
    effective batch as the DBM / KappaFace / ArcFace ladder runs.

augmentation:
  use_advanced: false

multi_task:
  enabled: false

ce:
  enabled: false

hace:
  enabled: false

loss_registry:
  enabled: true
  head: softmax
  aux: []

long_tail:
  logit_adjustment: false

ema:
  enabled: false

multi_crop:
  enabled: false
  crop_sizes: [224]
  target_size: 224

wandb:
  enabled: false
  entity: "gardoslab"
  project: "herbdl"
  resume: "allow"

evaluation:
  init_weights: /projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_LADDER_N15K_CE/model.safetensors
  predictions_path: /projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/LADDER_GEOM_TRAIN/n15k_ce/predictions.npz
  features_path: /projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/LADDER_GEOM_TRAIN/n15k_ce/features.npy
