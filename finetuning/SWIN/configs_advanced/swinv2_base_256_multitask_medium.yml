# =============================================================================
# SwinV2-Base @256 — Multi-task CE + Medium Aug + EMA + Balanced Softmax
# =============================================================================
# Full-technique run on the SwinV2-Base @256 backbone:
#   - Backbone  : SwinV2-B @256, ImageNet-22k pretrained
#   - Loss      : balanced-softmax CE (logit adjustment, tau=1.0) + multi-task
#                 family/genus/species heads; label smoothing 0.1 throughout
#   - Schedule  : 100 epochs, linear LR 1e-4, 5% warmup
#   - Aug       : MEDIUM — RandAugment mag 7, mixup+cutmix prob 0.3,
#                 random erasing 0.15, color jitter
#   - EMA       : enabled (decay=0.9998); keep load_best_model_at_end: false
#   - Hardware  : single A100-80G; batch 256 fits at 256px
#   - Gradient checkpointing: on
#
# Pair with swinv2_large_384_multitask_medium.yml for a Base vs Large comparison
# at equivalent technique stacks.
# =============================================================================

model:
  model_name_or_path: "microsoft/swinv2-base-patch4-window16-256"
  config_name: "microsoft/swinv2-base-patch4-window16-256"
  cache_dir: null
  model_revision: "main"
  image_processor_name: "microsoft/swinv2-base-patch4-window16-256"
  token: null
  trust_remote_code: false
  ignore_mismatched_sizes: true

data:
  dataset_name: null
  dataset_config_name: null
  data_file: null
  data_dir: null
  train_file: "/projectnb/herbdl/data/kaggle-herbaria/train_2022.json"
  validation_file: "/projectnb/herbdl/data/kaggle-herbaria/val_2022.json"
  image_column_name: "filename"
  label_column_name: "scientificNameEncoded"
  max_seq_length: 15
  max_train_samples: null
  max_eval_samples: 50000
  overwrite_cache: false
  preprocessing_num_workers: null
  train_val_split: 0.2

training:
  output_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWINV2_B_256_MEDIUM_MT_V2_SEED0"
  logging_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWINV2_B_256_MEDIUM_MT_V2_SEED0"
  do_train: true
  do_eval: true
  per_device_train_batch_size: 256
  per_device_eval_batch_size: 64
  learning_rate: 0.0001
  num_train_epochs: 100
  warmup_steps: 0.05                      # 5% warmup ratio (float → warmup_ratio in script)
  weight_decay: 0.05
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  lr_scheduler_type: "linear"
  logging_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 3
  eval_strategy: "epoch"
  eval_on_start: true
  load_best_model_at_end: false           # EMA copies weights at train end; do not reload
  report_to: "wandb"
  bf16: true
  dataloader_num_workers: 8
  remove_unused_columns: false
  overwrite_output_dir: false
  seed: 0

custom:
  lr_type: "linear"
  frozen: false
  frozen_type: "none"
  run_group: "SwinV2_B_256_Medium_MT_V2"
  run_name: "SwinV2_B_256_Medium_MT_V2_Seed0"
  run_id: "swinv2_b_256_medium_mt_v2_seed0"
  run_notes: >
    SwinV2-Base @256 in22k pretrained. Full technique stack at medium augmentation
    strength: RandAugment mag 7, mixup+cutmix prob 0.3, random erasing 0.15,
    label smoothing 0.1. Multi-task family/genus/species CE heads. Balanced-softmax
    logit adjustment (tau=1.0). EMA (decay=0.9998). Linear LR 1e-4 with 5% warmup,
    100 epochs. Paired with SwinV2-L @384 run for Base vs Large comparison.

augmentation:
  use_advanced: true
  randaugment:
    num_ops: 2
    magnitude: 7
  mixup:
    enabled: true
    alpha: 0.8
  cutmix:
    enabled: true
    alpha: 1.0
  mixup_cutmix_prob: 0.3
  label_smoothing: 0.1
  random_erasing:
    enabled: true
    probability: 0.15
    min_area: 0.02
    max_area: 0.33
  color_jitter:
    enabled: true
    brightness: 0.4
    contrast: 0.4
    saturation: 0.4
    hue: 0.1

multi_task:
  enabled: true
  min_species_samples: 2
  species_column: scientificNameEncoded   # full ~15.5k leaderboard classes, not epithet
  family_weight: 0.2
  genus_weight: 0.3
  species_weight: 1.0

long_tail:
  logit_adjustment: true
  tau: 1.0

ema:
  enabled: true
  decay: 0.9998

multi_crop:
  enabled: false
  crop_sizes: [256, 288, 320, 352, 384]
  target_size: 256
  flip: true

arcface:
  enabled: false
  embedding_size: 512
  scale: 30.0
  margin: 0.50
  num_subcenters: 3
  hybrid_ce_weight: 0.0

wandb:
  enabled: true
  entity: "gardoslab"
  project: "herbdl"
  resume: "allow"
