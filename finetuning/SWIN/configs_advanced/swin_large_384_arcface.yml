# =============================================================================
# ArcFace ablation — SWIN-L @384 + SubCenter ArcFace, nothing else
# =============================================================================
# Isolates the ArcFace contribution against the plain SWIN-L 384 baseline.
# Deliberately excludes multi-task heads, logit adjustment, EMA, and mixup/cutmix
# so results are directly attributable to the ArcFace loss.
#
# Augmentation: basic only (RandomResizedCrop + HFlip + RandAugment). Mixup and
# CutMix are incompatible with ArcFace hard-label margin and are left off.
# Random erasing and color jitter are safe (label-preserving) and left on.
#
# ArcFace settings: SubCenter k=3 (noise-robust), s=30, m=0.50 (standard).
# Inference uses cosine similarity over ArcFace weight matrix, no margin.
#
# NOTE: SWIN-L @384 with batch 256 is memory-heavy. If the job OOMs, reduce
# per_device_train_batch_size and raise gradient_accumulation_steps to keep
# effective batch constant (e.g. per_device=32, grad_accum=8 → effective 256).
# =============================================================================

model:
  model_name_or_path: "microsoft/swin-large-patch4-window12-384-in22k"
  config_name: "microsoft/swin-large-patch4-window12-384-in22k"
  cache_dir: null
  model_revision: "main"
  image_processor_name: "microsoft/swin-large-patch4-window12-384-in22k"
  token: null
  trust_remote_code: false
  ignore_mismatched_sizes: true

data:
  dataset_name: null
  dataset_config_name: null
  data_file: null
  data_dir: null
  train_file: "/projectnb/herbdl/data/kaggle-herbaria/train_2022.json"
  validation_file: "/projectnb/herbdl/data/kaggle-herbaria/val_2022.json"
  image_column_name: "filename"
  label_column_name: "scientificNameEncoded"
  max_seq_length: 15
  max_train_samples: null
  max_eval_samples: 50000
  overwrite_cache: false
  preprocessing_num_workers: null
  train_val_split: 0.2

training:
  output_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_L_384_ARCFACE"
  logging_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_L_384_ARCFACE"
  do_train: true
  do_eval: true
  per_device_train_batch_size: 256
  per_device_eval_batch_size: 32
  learning_rate: 0.0001
  num_train_epochs: 100
  warmup_steps: 0.05
  weight_decay: 0.05
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  lr_scheduler_type: "cosine"
  lr_scheduler_kwargs:
    eta_min: 0.000001
  logging_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 3
  eval_strategy: "epoch"
  eval_on_start: true
  load_best_model_at_end: false
  report_to: "wandb"
  bf16: true
  dataloader_num_workers: 8
  remove_unused_columns: false
  overwrite_output_dir: false
  seed: 0

custom:
  lr_type: "cosine"
  frozen: false
  frozen_type: "none"
  run_group: "SWIN_L_384_ArcFace"
  run_name: "SWIN_L_384_ArcFace"
  run_id: "swin_l_384_arcface"
  run_notes: >
    ArcFace ablation: SWIN-L @384 in22k pretrained + SubCenter ArcFace (k=3, s=30, m=0.50),
    no other techniques. Isolates ArcFace contribution against plain SWIN-L 384 baseline.
    No multi-task, no logit adjustment, no EMA, no mixup/cutmix.
    Basic aug only: RandAugment mag 7, random erasing, color jitter.

augmentation:
  use_advanced: true
  randaugment:
    num_ops: 2
    magnitude: 7
  mixup:
    enabled: false
  cutmix:
    enabled: false
  mixup_cutmix_prob: 0.0
  label_smoothing: 0.0
  random_erasing:
    enabled: true
    probability: 0.25
    min_area: 0.02
    max_area: 0.33
  color_jitter:
    enabled: true
    brightness: 0.4
    contrast: 0.4
    saturation: 0.4
    hue: 0.1

multi_task:
  enabled: false
  min_species_samples: 2
  family_weight: 0.2
  genus_weight: 0.3
  species_weight: 1.0

long_tail:
  logit_adjustment: false
  tau: 1.0

ema:
  enabled: false
  decay: 0.9998

multi_crop:
  enabled: false
  crop_sizes: [400, 416, 448, 480, 512]
  target_size: 384
  flip: true

arcface:
  enabled: true
  embedding_size: 512
  scale: 30.0
  margin: 0.50
  num_subcenters: 3
  hybrid_ce_weight: 0.0

wandb:
  enabled: true
  entity: "gardoslab"
  project: "herbdl"
  resume: "allow"
