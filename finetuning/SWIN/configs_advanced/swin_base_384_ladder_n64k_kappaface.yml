# Phase 6 scaling ladder: KAPPAFACE at the n64k rung (131,250 steps, 1 GPU).
# Generated by gen_ladder_configs.py from swin_base_384_dbm_pilot.yml; data from
# loss_ablation/build_ladder.py (nested species sets cut from the merged 2021+2022 manifest).

model:
  model_name_or_path: "microsoft/swin-base-patch4-window12-384-in22k"
  config_name: null
  cache_dir: null
  model_revision: "main"
  image_processor_name: null
  token: null
  trust_remote_code: false
  ignore_mismatched_sizes: true

data:
  dataset_name: null
  dataset_config_name: null
  data_file: null
  data_dir: null
  train_file: "/projectnb/herbdl/workspaces/faridkar/herbdl/data/ladder/n64k_train.json"
  validation_file: "/projectnb/herbdl/workspaces/faridkar/herbdl/data/ladder/n64k_val.json"
  image_column_name: "filepath"
  label_column_name: "scientificNameEncoded"
  max_seq_length: 15
  max_train_samples: null
  max_eval_samples: null
  overwrite_cache: false
  preprocessing_num_workers: null
  train_val_split: 0.2

training:
  output_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_LADDER_N64K_KAPPAFACE"
  logging_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_LADDER_N64K_KAPPAFACE"
  do_train: true
  do_eval: true
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 64
  learning_rate: 0.0001
  num_train_epochs: 50   # ignored: max_steps below fixes the budget
  max_steps: 131250   # = the 15k runs' 50 epochs x 2,625 steps: same compute at every rung
  warmup_steps: 500
  weight_decay: 0.01
  optim: "adamw_torch_fused"
  gradient_accumulation_steps: 4   # 64 * 4 * 1 GPU = effective batch 256 (KappaFace is 1-GPU only)
  lr_scheduler_type: "cosine"
  logging_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 3
  eval_strategy: "steps"
  eval_steps: 26250
  report_to: "wandb"
  bf16: true
  dataloader_num_workers: 16
  remove_unused_columns: false
  overwrite_output_dir: false
  resume_from_checkpoint: newest
  seed: 42

custom:
  lr_type: "cosine"
  frozen: false
  frozen_type: "none"
  run_group: "SWIN_Base_LADDER_N64K_KAPPAFACE"
  run_name: "SWIN_Base_LADDER_N64K_KAPPAFACE"
  run_id: "swin_base_ladder_n64k_kappaface"
  run_notes: >
    Real-scale pilot (50 epochs, 2 GPUs) of DBM, matched against the other
    384px pilots on every shared hyperparameter. First real-scale use of
    loss_ablation's own DBMHead and of the generic loss_registry production
    wiring.

augmentation:
  use_advanced: false

multi_task:
  enabled: false

arcface:
  enabled: false

hace:
  enabled: false

loss_registry:
  enabled: true
  head: kappaface
  head_kwargs:
    s: 30.0
    m0: 0.30
  aux: []

long_tail:
  logit_adjustment: false

ema:
  enabled: false

multi_crop:
  enabled: false
  crop_sizes: [224]
  target_size: 224

wandb:
  enabled: true
  entity: "gardoslab"
  project: "herbdl"
  resume: "allow"
