# Ladder: cosine softmax with ZERO margin (registry arcface head, s=30, m=0) at the 15.5k rung.
# Made from swin_base_384_ladder_n15k_arcface.yml: only m (0.30 -> 0), the output/run names, and the
# evaluation/worker settings differ. Same code, data, seed, 131,250 steps and effective batch 256.

model:
  model_name_or_path: "microsoft/swin-base-patch4-window12-384-in22k"
  config_name: null
  cache_dir: null
  model_revision: "main"
  image_processor_name: null
  token: null
  trust_remote_code: false
  ignore_mismatched_sizes: true

data:
  dataset_name: null
  dataset_config_name: null
  data_file: null
  data_dir: null
  train_file: "/projectnb/herbdl/workspaces/faridkar/herbdl/data/ladder/n15k_train.json"
  validation_file: "/projectnb/herbdl/workspaces/faridkar/herbdl/data/ladder/n15k_val.json"
  image_column_name: "filepath"
  label_column_name: "scientificNameEncoded"
  max_seq_length: 15
  max_train_samples: null
  max_eval_samples: null
  overwrite_cache: false
  preprocessing_num_workers: null
  train_val_split: 0.2

training:
  output_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_LADDER_N15K_COSINE_M0"
  logging_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_LADDER_N15K_COSINE_M0"
  do_train: true
  do_eval: false   # no evaluation inside the 2-GPU training job (two cosine segments froze at eval start); scored afterwards by the ladder eval pass
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 64
  learning_rate: 0.0001
  num_train_epochs: 50   # ignored: max_steps below fixes the budget
  max_steps: 131250   # = the 15k runs' 50 epochs x 2,625 steps: same compute at every rung
  warmup_steps: 500
  weight_decay: 0.01
  optim: "adamw_torch_fused"
  gradient_accumulation_steps: 2   # 64 * 2 * 2 GPUs = effective batch 256
  lr_scheduler_type: "cosine"
  logging_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 3
  eval_strategy: "no"
  eval_steps: 26250
  report_to: "wandb"
  bf16: true
  dataloader_num_workers: 8   # was 16 per GPU = 32 workers on a 16-core job
  remove_unused_columns: false
  overwrite_output_dir: false
  resume_from_checkpoint: newest
  seed: 42

custom:
  lr_type: "cosine"
  frozen: false
  frozen_type: "none"
  run_group: "SWIN_Base_LADDER_N15K_COSINE_M0"
  run_name: "SWIN_Base_LADDER_N15K_COSINE_M0"
  run_id: "swin_base_ladder_n15k_cosine_m0"
  run_notes: >
    Real-scale pilot (50 epochs, 2 GPUs) of DBM, matched against the other
    384px pilots on every shared hyperparameter. First real-scale use of
    loss_ablation's own DBMHead and of the generic loss_registry production
    wiring.

augmentation:
  use_advanced: false

multi_task:
  enabled: false

arcface:
  enabled: false

hace:
  enabled: false

loss_registry:
  enabled: true
  head: arcface
  head_kwargs:
    s: 30.0
    m: 0.0   # zero margin: ArcMarginHead with m=0 is a plain cosine softmax, s * cos(theta)
  aux: []

long_tail:
  logit_adjustment: false

ema:
  enabled: false

multi_crop:
  enabled: false
  crop_sizes: [224]
  target_size: 224

wandb:
  enabled: true
  entity: "gardoslab"
  project: "herbdl"
  resume: "allow"
