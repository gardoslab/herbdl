# =============================================================================
# X2-Softmax at 384px — real-scale pilot
# =============================================================================
# Same template as the other 384px pilots; enables loss_registry.head=x2softmax.
# s=30.0 matches loss_ablation/e2e_harness.py's already-validated smoke-test
# config (a, h, k left at X2SoftmaxHead's own defaults, same as the harness).
#
# First real-scale use of loss_ablation's own X2SoftmaxHead and of the generic
# `loss_registry` production wiring shared with kappaface/dbm/arcface+ecc.
#
# Same 12h-per-job-slot / multi-resume expectation as the earlier pilots.
# =============================================================================

model:
  model_name_or_path: "microsoft/swin-base-patch4-window12-384-in22k"
  config_name: null
  cache_dir: null
  model_revision: "main"
  image_processor_name: null
  token: null
  trust_remote_code: false
  ignore_mismatched_sizes: true

data:
  dataset_name: null
  dataset_config_name: null
  data_file: null
  data_dir: null
  train_file: "/projectnb/herbdl/data/kaggle-herbaria/train_2022.json"
  validation_file: "/projectnb/herbdl/data/kaggle-herbaria/val_2022.json"
  image_column_name: "filename"
  label_column_name: "scientificNameEncoded"
  max_seq_length: 15
  max_train_samples: null
  max_eval_samples: null
  overwrite_cache: false
  preprocessing_num_workers: null
  train_val_split: 0.2

training:
  output_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_X2SOFTMAX_384_PILOT"
  logging_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_X2SOFTMAX_384_PILOT"
  do_train: true
  do_eval: true
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 64
  learning_rate: 0.0001
  num_train_epochs: 50
  warmup_steps: 500
  weight_decay: 0.01
  optim: "adamw_torch_fused"
  gradient_accumulation_steps: 2   # 64 * 2 * 2 GPUs = effective batch 256
  lr_scheduler_type: "cosine"
  logging_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 55
  eval_strategy: "steps"
  eval_steps: 8964
  report_to: "wandb"
  bf16: true
  dataloader_num_workers: 16
  remove_unused_columns: false
  # Set back to false after the one deliberate fresh start this needed (2nd launch,
  # after the acos(>1)=NaN fix). Real bug caught here: this flag makes the script SKIP
  # checkpoint detection entirely (`if ... and not overwrite_output_dir:` in main()),
  # not just permit overwriting -- left at true, EVERY subsequent relaunch silently
  # restarts from step 0 instead of resuming, no error or warning. This is why the
  # "2nd launch" (af6979c9's successor) looked like it was converging far slower than
  # every other pilot (17%->23% accuracy across epochs 3-14, vs. 74-83% for the
  # others): it was NOT slow convergence, it was quietly redoing epochs 0-14 every
  # single 12h cycle, never actually progressing past there. Confirmed by checking for
  # the "Checkpoint detected" log line, which was absent on the most recent launch.
  overwrite_output_dir: false
  # Explicit, not auto-detected: the output_dir also contains checkpoint-102375+,
  # saved by the FIRST (NaN'd) launch racing through no-op steps post-collapse under
  # completely frozen weights -- a real checkpoint that trivially "wins"
  # get_last_checkpoint()'s highest-step-number heuristic over the two later, genuinely
  # healthy from-scratch relaunches (checkpoint-36750 and this one, checkpoint-39375).
  # Confirmed poisoned by resuming from it once already: reproduced the exact same NaN
  # immediately. checkpoint-39375 is the furthest REAL, non-NaN checkpoint on record
  # (1d7875ca's own final save, epoch 15, eval_accuracy 0.2209 there) -- force it
  # explicitly rather than trust auto-detection again.
  resume_from_checkpoint: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_X2SOFTMAX_384_PILOT/checkpoint-39375"
  seed: 42

custom:
  lr_type: "cosine"
  frozen: false
  frozen_type: "none"
  run_group: "SWIN_Base_X2Softmax_384_Pilot"
  run_name: "SWIN_Base_X2Softmax_384_Pilot"
  run_id: "swin_base_x2softmax_384_pilot"
  run_notes: >
    Real-scale pilot (50 epochs, 2 GPUs) of X2-Softmax, matched against the
    other 384px pilots on every shared hyperparameter. First real-scale use
    of loss_ablation's own X2SoftmaxHead and of the generic loss_registry
    production wiring.

augmentation:
  use_advanced: false

multi_task:
  enabled: false

arcface:
  enabled: false

hace:
  enabled: false

loss_registry:
  enabled: true
  head: x2softmax
  head_kwargs:
    s: 30.0
  aux: []

long_tail:
  logit_adjustment: false

ema:
  enabled: false

multi_crop:
  enabled: false
  crop_sizes: [224]
  target_size: 224

wandb:
  enabled: true
  entity: "gardoslab"
  project: "herbdl"
  resume: "allow"
