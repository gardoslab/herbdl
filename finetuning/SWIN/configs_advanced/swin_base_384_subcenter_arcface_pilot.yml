# =============================================================================
# Sub-center ArcFace (k=3) at 384px — real-scale pilot
# =============================================================================
# Cloned from the 384px ArcFace ablation (same backbone/data/optimizer/schedule/
# seed/aug); the ONE thing that changes is arcface.num_subcenters: 1 -> 3.
# k=3 matches loss_ablation/e2e_harness.py's already-validated `subcenter_arcface`
# smoke-test config (k=3, s=30, m=0.30) — this is that same idea at real scale
# and real epoch count, not a from-scratch hyperparameter choice.
#
# This needed ZERO new production code: SwinWithArcFace/SubCenterArcMarginProduct
# already take num_subcenters (default 3) — the currently-running 384px ablation
# just happens to run with num_subcenters=1 (plain ArcFace). This config is the
# k>1 side of that same, already-proven code path.
#
# 2-GPU DDP: per_device_train_batch_size unchanged, gradient_accumulation_steps
# halved (4 -> 2) vs a 1-GPU config, holding effective batch at 256 — the same
# convention swin_large_384_concrete_2gpu.yml already uses for its own 1-GPU ->
# 2-GPU config pair.
#
# Launch with NPROC_PER_NODE=2 (torchrun DDP via train_advanced.sh) and 2 GPUs.
# 50 epochs is a genuinely long run (the matched-epoch 384px ArcFace comparison
# takes on the order of 30h+ even at 1 GPU/256 effective batch); each job slot
# is capped at 12h wall-clock (this cluster's default), so this WILL need
# several resume cycles via HERBDL_NO_RELOCATE=1 to actually reach 50 epochs —
# expected and handled by SWIN_finetuning_advanced.py's existing checkpoint
# resume logic, not a sign anything is wrong if a run stops around 12h in.
# =============================================================================

model:
  model_name_or_path: "microsoft/swin-base-patch4-window12-384-in22k"
  config_name: null
  cache_dir: null
  model_revision: "main"
  image_processor_name: null
  token: null
  trust_remote_code: false
  ignore_mismatched_sizes: true

data:
  dataset_name: null
  dataset_config_name: null
  data_file: null
  data_dir: null
  train_file: "/projectnb/herbdl/data/kaggle-herbaria/train_2022.json"
  validation_file: "/projectnb/herbdl/data/kaggle-herbaria/val_2022.json"
  image_column_name: "filename"
  label_column_name: "scientificNameEncoded"
  max_seq_length: 15
  max_train_samples: null
  max_eval_samples: null   # full 167,955-image val split — do not subsample
  overwrite_cache: false
  preprocessing_num_workers: null
  train_val_split: 0.2     # unused: validation_file is set explicitly above

training:
  output_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_SUBCENTER_ARCFACE_384_PILOT"
  logging_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_SUBCENTER_ARCFACE_384_PILOT"
  do_train: true
  do_eval: true
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 64
  learning_rate: 0.0001
  num_train_epochs: 50
  warmup_steps: 500
  weight_decay: 0.01
  optim: "adamw_torch_fused"
  gradient_accumulation_steps: 2   # 64 * 2 * 2 GPUs = effective batch 256, matching the 1-GPU ablation
  lr_scheduler_type: "cosine"
  logging_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 55             # keep every epoch (50) for training-dynamics analysis
  eval_strategy: "steps"
  eval_steps: 8964
  report_to: "wandb"
  bf16: true
  dataloader_num_workers: 16
  remove_unused_columns: false
  overwrite_output_dir: false
  seed: 42

custom:
  lr_type: "cosine"
  frozen: false
  frozen_type: "none"
  run_group: "SWIN_Base_SubcenterArcFace_384_Pilot"
  run_name: "SWIN_Base_SubcenterArcFace_384_Pilot"
  run_id: "swin_base_subcenter_arcface_384_pilot"
  run_notes: >
    Real-scale pilot (50 epochs, 2 GPUs) of sub-center ArcFace (k=3), matched
    against the 384px plain-ArcFace (k=1) ablation on every other
    hyperparameter. De-risks wiring loss_ablation's registry ideas into the
    production trainer before running all 9 losses at this scale.

augmentation:
  use_advanced: false

multi_task:
  enabled: false

arcface:
  enabled: true
  embedding_size: null
  scale: 30.0
  margin: 0.3
  num_subcenters: 3          # the one change vs the plain-ArcFace 384px ablation
  hybrid_ce_weight: 0.0
  margin_warmup_epochs: 5    # same stability mitigation as the plain-ArcFace run

hace:
  enabled: false

long_tail:
  logit_adjustment: false

ema:
  enabled: false

multi_crop:
  enabled: false
  crop_sizes: [224]
  target_size: 224

wandb:
  enabled: true
  entity: "gardoslab"
  project: "herbdl"
  resume: "allow"
