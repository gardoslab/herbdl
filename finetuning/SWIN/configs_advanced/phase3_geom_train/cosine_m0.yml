# Training-image geometry: pooled features of the cosine_m0 model over the TRAIN split.
# Copy of configs_advanced/phase3_geom/cosine_m0.yml with four changes:
#   data.validation_file -> train_2022.json   (evaluate the train split, not val)
#   output/features/predictions -> PHASE3_GEOM_TRAIN/cosine_m0
#   per_device_eval_batch_size 64 -> 128;  dataloader_num_workers 16 -> 8 (two extractions share a 16-core job)
# do_train is false: one forward pass per image, no gradients, no training.
# Eval-only re-score of the SWIN_BASE_COSINE_M0_384 model on the full validation set, saving pooled features
# and per-image predictions. GENERATED from swin_base_384_cosine_m0.yml (do_train false, W&B off, output -> PHASE3_GEOM/cosine_m0).
model:
  model_name_or_path: microsoft/swin-base-patch4-window12-384-in22k
  config_name: null
  cache_dir: null
  model_revision: main
  image_processor_name: null
  token: null
  trust_remote_code: false
  ignore_mismatched_sizes: true
data:
  dataset_name: null
  dataset_config_name: null
  data_file: null
  data_dir: null
  train_file: /projectnb/herbdl/data/kaggle-herbaria/train_2022.json
  validation_file: /projectnb/herbdl/data/kaggle-herbaria/train_2022.json
  image_column_name: filename
  label_column_name: scientificNameEncoded
  max_seq_length: 15
  max_train_samples: null
  max_eval_samples: null
  overwrite_cache: false
  preprocessing_num_workers: null
  train_val_split: 0.2
training:
  output_dir: /projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/PHASE3_GEOM_TRAIN/cosine_m0
  logging_dir: /projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/PHASE3_GEOM_TRAIN/cosine_m0
  do_train: false
  do_eval: true
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 128
  learning_rate: 0.0001
  num_train_epochs: 50
  warmup_steps: 500
  weight_decay: 0.01
  optim: adamw_torch_fused
  gradient_accumulation_steps: 2
  lr_scheduler_type: cosine
  logging_strategy: epoch
  save_strategy: epoch
  save_total_limit: 3
  eval_strategy: steps
  eval_steps: 8964
  report_to: none
  bf16: true
  dataloader_num_workers: 8
  remove_unused_columns: false
  overwrite_output_dir: false
  resume_from_checkpoint: null
  seed: 42
custom:
  lr_type: cosine
  frozen: false
  frozen_type: none
  run_group: SWIN_BASE_COSINE_M0_384
  run_name: SWIN_BASE_COSINE_M0_384
  run_id: swin_base_cosine_m0_384
  run_notes: 'Margin-size control: cosine softmax, s=30, m=0, on the Part 1 data.
    Same trainer, data, seed and schedule as the DBM and CE base runs; only the head
    differs.

    '
augmentation:
  use_advanced: false
multi_task:
  enabled: false
arcface:
  enabled: false
hace:
  enabled: false
loss_registry:
  enabled: true
  head: arcface
  head_kwargs:
    s: 30.0
    m: 0.0
  aux: []
long_tail:
  logit_adjustment: false
  tau: 1.0
ema:
  enabled: false
multi_crop:
  enabled: false
  crop_sizes:
  - 224
  target_size: 224
wandb:
  enabled: false
  entity: gardoslab
  project: herbdl
  resume: allow
evaluation:
  init_weights: /projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_COSINE_M0_384/model.safetensors
  features_path: /projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/PHASE3_GEOM_TRAIN/cosine_m0/features.npy
  predictions_path: /projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/PHASE3_GEOM_TRAIN/cosine_m0/predictions.npz
