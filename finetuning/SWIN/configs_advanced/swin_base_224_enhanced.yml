# SWIN Base 224 Enhanced Configuration
# Phase 1: Quick wins - Higher LR + Enhanced Augmentation
# Expected improvements: ~2-3% over baseline

# Model configuration
model:
  model_name_or_path: "microsoft/swin-base-patch4-window7-224-in22k"
  config_name: null
  cache_dir: null
  model_revision: "main"
  image_processor_name: null
  token: null
  trust_remote_code: false
  ignore_mismatched_sizes: true

# Data configuration
data:
  dataset_name: null
  dataset_config_name: null
  data_file: null
  data_dir: null
  train_file: "/projectnb/herbdl/data/kaggle-herbaria/train.json"
  validation_file: "/projectnb/herbdl/data/kaggle-herbaria/val.json"
  image_column_name: "filepath"
  label_column_name: "scientificNameEncoded"
  max_seq_length: 15
  max_train_samples: null
  max_eval_samples: 50000
  overwrite_cache: false
  preprocessing_num_workers: null
  train_val_split: 0.2

# Training configuration
training:
  output_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_224_ENHANCED"
  logging_dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_224_ENHANCED"
  do_train: true
  do_eval: true
  per_device_train_batch_size: 128
  per_device_eval_batch_size: 32
  learning_rate: 0.0005  # 5e-4 (increased from 2e-4) → +1.54% expected gain
  num_train_epochs: 100
  warmup_steps: 500
  weight_decay: 0.01  # Added for regularization
  gradient_accumulation_steps: 1
  lr_scheduler_type: "cosine"
  lr_scheduler_kwargs:
    eta_min: 0.000001
  logging_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 5
  eval_strategy: "steps"
  eval_steps: 8964
  report_to: "wandb"
  bf16: true
  dataloader_num_workers: 8
  remove_unused_columns: false
  overwrite_output_dir: false
  seed: 42

# Custom configuration
custom:
  lr_type: "cosine"
  frozen: false
  frozen_type: "none"
  run_group: "SWIN_Base_Enhanced"
  run_name: "SWIN_Base_224_Enhanced"
  run_id: "swin_base_224_enh_112425"

# Advanced augmentation settings
augmentation:
  use_advanced: true
  randaugment:
    num_ops: 2  # Number of augmentation operations to apply
    magnitude: 9  # Magnitude of augmentations (0-10)
  mixup:
    enabled: true
    alpha: 0.8  # Mixup alpha parameter
  cutmix:
    enabled: true
    alpha: 1.0  # CutMix alpha parameter
  mixup_cutmix_prob: 0.5  # Probability of applying mixup/cutmix
  label_smoothing: 0.1  # Label smoothing epsilon
  # Additional augmentations
  random_erasing:
    enabled: true
    probability: 0.25
    min_area: 0.02
    max_area: 0.33
  color_jitter:
    enabled: true
    brightness: 0.4
    contrast: 0.4
    saturation: 0.4
    hue: 0.1

# Multi-crop testing configuration (for inference only)
multi_crop:
  enabled: false  # Set to true for inference/evaluation
  crop_sizes: [256, 288, 320, 384, 448]  # Resize to these before center crop
  target_size: 224  # Final crop size

# WandB configuration
wandb:
  entity: "gardoslab"
  project: "herbdl"
  resume: "allow"
