# SWIN-Base 384 + DBM with heavy augmentation, ramped in over 10 epochs. Same as swin_base_384_dbm_pilot.yml except augmentation.
# Literature: DeiT (Touvron 2021) / Swin (Liu 2021) recipe for RandAugment m9, mixup 0.8, CutMix 1.0, smoothing 0.1; ramp-in per EfficientNetV2 (Tan & Le 2021).
model:
  model_name_or_path: microsoft/swin-base-patch4-window12-384-in22k
  config_name: null
  cache_dir: null
  model_revision: main
  image_processor_name: null
  token: null
  trust_remote_code: false
  ignore_mismatched_sizes: true
data:
  dataset_name: null
  dataset_config_name: null
  data_file: null
  data_dir: null
  train_file: /projectnb/herbdl/data/kaggle-herbaria/train_2022.json
  validation_file: /projectnb/herbdl/data/kaggle-herbaria/val_2022.json
  image_column_name: filename
  label_column_name: scientificNameEncoded
  max_seq_length: 15
  max_train_samples: null
  max_eval_samples: null
  overwrite_cache: false
  preprocessing_num_workers: null
  train_val_split: 0.2
training:
  output_dir: /projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_DBM_384_HEAVYAUG
  logging_dir: /projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_DBM_384_HEAVYAUG
  do_train: true
  do_eval: true
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 64
  learning_rate: 0.0001
  num_train_epochs: 50
  warmup_steps: 500
  weight_decay: 0.01
  optim: adamw_torch_fused
  gradient_accumulation_steps: 2
  lr_scheduler_type: cosine
  logging_strategy: epoch
  save_strategy: epoch
  save_total_limit: 3
  eval_strategy: steps
  eval_steps: 8964
  report_to: wandb
  bf16: true
  dataloader_num_workers: 16
  remove_unused_columns: false
  overwrite_output_dir: false
  seed: 42
  resume_from_checkpoint: newest
custom:
  lr_type: cosine
  frozen: false
  frozen_type: none
  run_group: SWIN_Base_DBM_384_HeavyAug
  run_name: SWIN_Base_DBM_384_HeavyAug
  run_id: swin_base_dbm_384_heavyaug
  run_notes: 'Part 1 DBM run (SWIN-Base 384, Herbarium 2022, 2 GPU, 50 epochs) with
    heavy augmentation ramped in over 10 epochs: RandAugment n=2 m=9, mixup 0.8 /
    CutMix 1.0 on half the batches, label smoothing 0.1 (DeiT/Swin recipe). Everything
    else identical.'
augmentation:
  use_advanced: true
  warmup_epochs: 10
  randaugment:
    num_ops: 2
    magnitude: 9
  mixup:
    enabled: true
    alpha: 0.8
  cutmix:
    enabled: true
    alpha: 1.0
  mixup_cutmix_prob: 0.5
  label_smoothing: 0.1
  random_erasing:
    enabled: false
  color_jitter:
    enabled: false
multi_task:
  enabled: false
arcface:
  enabled: false
hace:
  enabled: false
loss_registry:
  enabled: true
  head: dbm
  head_kwargs:
    s: 30.0
  aux: []
long_tail:
  logit_adjustment: false
ema:
  enabled: false
multi_crop:
  enabled: false
  crop_sizes:
  - 224
  target_size: 224
wandb:
  enabled: true
  entity: gardoslab
  project: herbdl
  resume: allow
