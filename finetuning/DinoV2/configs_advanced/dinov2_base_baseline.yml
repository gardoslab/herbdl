# DinoV2 Base Baseline Configuration
# All augmentations OFF, no freezing, no multi-task, no multi-crop TTA — first reference run.

# Model configuration
model:
  model_name_or_path: "facebook/dinov2-base"
  config_name: null
  cache_dir: null
  model_revision: "main"
  image_processor_name: null
  token: null
  trust_remote_code: false
  ignore_mismatched_sizes: true

# Data configuration
data:
  dataset_name: null
  dataset_config_name: null
  data_file: null
  data_dir: null
  train_file: "/projectnb/herbdl/data/kaggle-herbaria/train_2022.json"
  validation_file: "/projectnb/herbdl/data/kaggle-herbaria/val_2022.json"
  image_column_name: "filename"
  label_column_name: "scientificNameEncoded"
  max_seq_length: 15
  max_train_samples: null
  max_eval_samples: 50000
  overwrite_cache: false
  preprocessing_num_workers: null
  train_val_split: 0.2

# Training configuration
training:
  output_dir: "/projectnb/herbdl/workspaces/llindon/herbdl/finetuning/output/DinoV2/DINOV2_BASE_BASELINE_F1_MACRO"
  logging_dir: "/projectnb/herbdl/workspaces/llindon/herbdl/finetuning/output/DinoV2/DINOV2_BASE_BASELINE_F1_MACRO"
  do_train: true
  do_eval: true
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 32
  learning_rate: 0.0001
  num_train_epochs: 50
  warmup_steps: 500
  weight_decay: 0.01
  gradient_accumulation_steps: 1
  lr_scheduler_type: "cosine"
  lr_scheduler_kwargs:
    eta_min: 0.000001
  logging_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 5
  eval_strategy: "steps"
  eval_steps: 8964
  report_to: "wandb"
  bf16: true
  dataloader_num_workers: 8
  remove_unused_columns: false
  overwrite_output_dir: false
  seed: 42

# Custom configuration
custom:
  lr_type: "cosine"
  frozen: false
  frozen_type: "none"
  run_group: "DinoV2_Base"
  run_name: "DinoV2_Base_Baseline_f1_macro"
  run_id: "dinov2_base_baseline_f1_macro_051226"

# Advanced augmentation settings (ALL TURNED OFF — kept here for easy re-enable)
augmentation:
  use_advanced: false
  randaugment:
    num_ops: 0
    magnitude: 9
  mixup:
    enabled: false
    alpha: 0.8
  cutmix:
    enabled: false
    alpha: 1.0
  mixup_cutmix_prob: 0.5
  label_smoothing: 0.0
  random_erasing:
    enabled: false
    probability: 0.25
    min_area: 0.02
    max_area: 0.33
  color_jitter:
    enabled: false
    brightness: 0.4
    contrast: 0.4
    saturation: 0.4
    hue: 0.1

# Multi-crop TTA (off for baseline)
multi_crop:
  enabled: false
  crop_sizes: [256, 288, 320, 384, 448]
  target_size: 224

# WandB configuration
wandb:
  entity: "gardoslab"
  project: "herbdl"
  resume: "allow"
