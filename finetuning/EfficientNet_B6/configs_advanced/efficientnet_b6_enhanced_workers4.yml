# EfficientNet B6 Enhanced Configuration
# Augmentations are turned OFF for this baseline run (kept in file but disabled)

# Model configuration
model:
  model_name_or_path: "google/efficientnet-b6"
  config_name: null
  cache_dir: null
  model_revision: "main"
  image_processor_name: null
  token: null
  trust_remote_code: false
  ignore_mismatched_sizes: true

# Data configuration
data:
  dataset_name: null
  dataset_config_name: null
  data_file: null
  data_dir: null
  train_file: "/projectnb/herbdl/data/kaggle-herbaria/train_2022.json"
  validation_file: "/projectnb/herbdl/data/kaggle-herbaria/val_2022.json"
  image_column_name: "filename"
  label_column_name: "scientificNameEncoded"
  max_seq_length: 15
  max_train_samples: null
  # NOTE: val set only covers ~21,745 of 64,113 classes; top-k metrics
  # reflect a partial slice of the label space, not full-vocabulary accuracy.
  max_eval_samples: 50000
  overwrite_cache: false
  preprocessing_num_workers: null
  train_val_split: 0.2

# Training configuration
training:
  output_dir: "/projectnb/herbdl/workspaces/llindon/herbdl/finetuning/output/EfficientNet_B6/EFFNET_B6_ENHANCED_F1_MACRO"
  logging_dir: "/projectnb/herbdl/workspaces/llindon/herbdl/finetuning/output/EfficientNet_B6/EFFNET_B6_ENHANCED_F1_MACRO"
  do_train: true
  do_eval: true
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  learning_rate: 0.0005  # 5e-4 (increased from 2e-4) → +1.54% expected gain
  # TODO(perf): currently running under DataParallel (n_gpu=2, distributed=False).
  # Switch launcher to `torchrun --nproc_per_node=2` for DDP — faster + balanced
  # across GPUs. Not changing yet, just flagging.
  num_train_epochs: 30
  warmup_steps: 650     # ~1% of ~65.6k total steps on 2022 data (672k samples × 25 ep / eff batch 256)
  weight_decay: 0.01  # Added for regularization
  # 16/device × 2 GPUs (DP) × 8 = effective batch 256 (same as before); needed
  # after prior runs OOMed at 528×528 with bs 64/device on 80GB A100.
  gradient_accumulation_steps: 8
  gradient_checkpointing: false  # EfficientNetForImageClassification does not support gradient checkpointing
  lr_scheduler_type: "cosine"
  learning_rate_kwargs:
    eta_min: 0.000001
  logging_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 5
  eval_strategy: "steps"
  eval_steps: 8964
  report_to: "wandb"
  bf16: true
  dataloader_num_workers: 4
  remove_unused_columns: false
  overwrite_output_dir: false
  seed: 42

# Custom configuration
custom:
  lr_type: "cosine"
  frozen: false
  frozen_type: "none"
  run_group: "EfficientNet_B6_Enhanced"
  run_name: "EfficientNet_B6_Enhanced_f1_macro"
  run_id: "effnet_b6_enh_f1_macro_051226"

# Advanced augmentation settings (ALL TURNED OFF - kept here for easy re-enable)
augmentation:
  use_advanced: false  # Master switch - off disables every augmentation below
  randaugment:
    num_ops: 0  # 0 disables RandAugment even when use_advanced is true
    magnitude: 9
  mixup:
    enabled: false
    alpha: 0.8
  cutmix:
    enabled: false
    alpha: 1.0
  mixup_cutmix_prob: 0.5
  label_smoothing: 0.0
  # Additional augmentations
  random_erasing:
    enabled: false
    probability: 0.25
    min_area: 0.02
    max_area: 0.33
  color_jitter:
    enabled: false
    brightness: 0.4
    contrast: 0.4
    saturation: 0.4
    hue: 0.1

# Multi-crop testing configuration (for inference only)
multi_crop:
  enabled: false  # Set to true for inference/evaluation
  crop_sizes: [256, 288, 320, 384, 448]  # Resize to these before center crop
  target_size: 224  # Final crop size

# WandB configuration
wandb:
  entity: "gardoslab"
  project: "herbdl"
  resume: "allow"
