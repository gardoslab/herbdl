# SWIN_BASE_ARCFACE_ABLATION: microsoft/swin-base-patch4-window7-224-in22k
# fine-tuned to 15,501 Kaggle-Herbarium-2022 species with an ArcFace head
# (s=30, m=0.3, k=1, 5-epoch margin warmup, no bottleneck/BN/hybrid/multi-task).
# Reported val accuracy 0.7971, F1 0.7605.
model:
  # Controlled ArcFace counterpart to SWIN_BASE_BASELINE: identical backbone,
  # resolution, data, split, seed and schedule; only the head differs.
  # Reported 0.7971 / 0.7605 vs the baseline's 0.7797 / 0.7455.
  checkpoint: /projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_ARCFACE_ABLATION
  label_mapping: /projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/SWIN_BASE_ARCFACE_ABLATION/label_mapping.json
  # linear -> classifier.weight ; arcface -> arcface.weight (read by name, since
  # from_pretrained would silently substitute a random classifier here).
  head: arcface
  arcface_scale: 30.0

data:
  # The exact split the checkpoint was evaluated on: the config that trained it
  # passes validation_file, so HF never re-splits and val == this file.
  val_manifest: /projectnb/herbdl/data/kaggle-herbaria/val_2022.json
  # Only used for the per-class training-frequency covariate.
  train_manifest: /projectnb/herbdl/data/kaggle-herbaria/train_2022.json
  image_column: filename
  label_column: scientificNameEncoded

extract:
  # Which val-time pipeline to cache features under. `eval_protocol` mirrors
  # SWIN_finetuning.py's _val_transforms. The probe below re-verifies that it
  # reproduces THIS checkpoint's reported accuracy, not just the baseline's.
  preprocess: eval_protocol
  cache_root: /projectnb/herbdl/workspaces/faridkar/herbdl/repgeom/cache
  batch_size: 128
  num_workers: 16
  topk: 5

analysis:
  # Score this many sampled val images under every candidate preprocessing and
  # print the comparison. 0 disables the probe.
  preprocess_probe_n: 20000
  # Per-class recall on fewer than this many val images is too noisy to regress on.
  min_val_per_class: 5
