# Label-cardinality sweep -- balanced regime, FINE-TUNED SWIN representation.
#
# This is the config the fixed run command reads. Child experiment nodes edit
# THIS file on their own branch; the run command never changes.

data:
  # Kaggle Herbarium 2022. The census printed at the start of every run states
  # exactly what was loaded -- read it before trusting any number below it.
  manifest: "/projectnb/herbdl/data/kaggle-herbaria/train_2022.csv"
  image_root: "/projectnb/herbdl/data/kaggle-herbaria/herbarium-2022/train_images/"
  image_column: "filename"
  label_column: "scientificNameEncoded"

  # Probe-eval images come from the split held out of SWIN fine-tuning
  # (finetuning/SWIN/configs/swin_base_baseline.yml trains on train_2022.json
  # with val_2022.json as validation). This is NOT optional for a fine-tuned
  # backbone: scoring it on images it was fine-tuned on measures memorisation,
  # which would flatten the cardinality curve for a completely uninteresting
  # reason. The run asserts the two pools do not share a path.
  eval_manifest: "/projectnb/herbdl/data/kaggle-herbaria/val_2022.json"
  fail_on_pool_overlap: true

features:
  # Frozen at sweep time, but -- unlike the parent node -- this backbone WAS
  # trained on the 15k herbarium label space. That is the point of this node,
  # and it changes the question being asked:
  #   parent  : how far does a GENERIC representation carry as labels multiply?
  #   here    : how far does a representation OPTIMISED FOR EXACTLY THIS 15k
  #             decision carry as labels multiply?
  # The features here already encode the 15k-way decision, so this arm cannot
  # be read as a clean measure of intrinsic task difficulty. It answers the
  # practical question instead: does task-adapted pretraining change the SHAPE
  # of the decline, or only its height? Held-out eval (above) is what keeps
  # even that question answerable.
  # Fine-tuned on the full Kaggle-2022 15k label space. This session cannot
  # list the SCC checkpoint tree (SSH needs 2FA), so the run inventories it and
  # tries these names in order; the inventory is printed before anything
  # expensive happens, so a miss is diagnosable from the log alone.
  backbone:
    - "SWIN_BASE_BASELINE"
    - "SWIN_B_BASELINE_HIGHER_LR"
    - "SWIN_B_BASELINE"
  checkpoint_roots:
    - "/projectnb/herbdl/workspaces/faridkar/herbdl/finetuning/output/SWIN/"
  # Hard constraint, not a preference -- a 50-class checkpoint whose directory
  # name happens to match is refused rather than silently substituted.
  expect_num_labels: 15501
  # Last resort if no name matches: take the highest-checkpoint model whose
  # label space is within 25% of the above, and say so loudly in the log.
  auto_select_by_label_count: true
  image_size: 224
  batch_size: 256
  num_workers: 16
  # Outside the run directory: this cache is the expensive artifact and every
  # later node in this line reuses it.
  cache_root: "/projectnb/herbdl/workspaces/faridkar/herbdl/scaling/features"

sweep:
  # Images per class, held constant at every N. This is the whole point of the
  # control: "more classes" must not also mean "more or less evidence per class".
  k_train: 10
  k_eval: 5
  # The ladder is capped at however many classes actually have k_train+k_eval
  # usable images; the resolved ceiling is appended automatically and logged.
  n_classes: [50, 200, 1000, 5000, 15000]
  seeds: [0, 1, 2]
  # The first `anchor_classes` of each seed's shuffled order. Nested sampling
  # keeps them present at every N with identical train/eval images.
  anchor_classes: 50

probe:
  lr: 0.001
  weight_decay: 0.0001
  # `steps` is now only a fallback; the ladder below drives training.
  steps: 4000
  batch_size: 1024
  label_smoothing: 0.0

  # The parent node fixed 4000 steps at every N. That equalised COMPUTE but not
  # PASSES OVER THE DATA -- 8,192 epochs at N=50 against 30 at N=13,548 -- and
  # the top rungs came out undertrained (train acc 0.492, and doubling the
  # budget moved macro-F1 0.160 -> 0.199).
  #
  # Rather than pick a different fixed number and inherit a different bias,
  # this node measures the budget instead of assuming it. Each (N, seed) is
  # trained at every rung of this ladder -- each a COMPLETE OneCycle schedule
  # from scratch -- and climbs until doubling buys less than `convergence_tol`
  # macro-F1. Steps-to-convergence is then itself a reported quantity.
  budget_ladder: [4000, 8000, 16000, 32000, 64000, 128000]
  convergence_tol: 0.005

output:
  dir: "/projectnb/herbdl/workspaces/faridkar/herbdl/scaling/results"
  results_file: "cardinality_finetuned_swin15k.json"
